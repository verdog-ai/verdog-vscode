name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check version matches tag
        run: |
          node -e 'const { version } = require("./package.json"); if (process.env.GITHUB_REF_NAME !== `v${version}`) throw new Error("Tag must match package.json version");'

      - name: Install dependencies
        run: npm ci

      - name: Check style and types
        run: npm run check

      - name: Test
        run: npm test

      - name: Check published run-history contract
        uses: ./.github/actions/run-history-contract

      - name: Package extension
        run: npm run package -- --githubBranch "$GITHUB_REF_NAME"

      - name: Archive matching source
        run: git archive --format=tar.gz --prefix="verdog-vscode-${GITHUB_REF_NAME}/" --output="verdog-vscode-${GITHUB_REF_NAME}-source.tar.gz" HEAD

      - name: Upload VSIX and source
        uses: actions/upload-artifact@v4
        with:
          name: verdog-vscode
          path: |
            *.vsix
            verdog-vscode-*-source.tar.gz
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download VSIX and source
        uses: actions/download-artifact@v4
        with:
          name: verdog-vscode

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" *.vsix verdog-vscode-*-source.tar.gz --verify-tag --generate-notes

  marketplace:
    needs: release
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install publishing tools
        run: npm ci --ignore-scripts

      - name: Download VSIX and source
        uses: actions/download-artifact@v4
        with:
          name: verdog-vscode

      - name: Authenticate to Marketplace
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Show Marketplace identity
        run: |
          az rest --method get \
            --url 'https://app.vssps.visualstudio.com/_apis/profile/profiles/me?api-version=7.1' \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query id --output tsv

      - name: Publish existing VSIX
        run: npx --no-install vsce publish --azure-credential --packagePath *.vsix --skip-duplicate
