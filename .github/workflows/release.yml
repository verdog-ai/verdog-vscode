name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check version matches tag
        run: |
          node -e 'const { version } = require("./package.json"); if (process.env.GITHUB_REF_NAME !== `v${version}`) throw new Error("Tag must match package.json version");'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Package extension
        run: npm run package

      - name: Archive matching source
        run: git archive --format=tar.gz --prefix="verdog-vscode-${GITHUB_REF_NAME}/" --output="verdog-vscode-${GITHUB_REF_NAME}-source.tar.gz" HEAD

      - name: Upload VSIX and source
        uses: actions/upload-artifact@v4
        with:
          name: verdog-vscode
          path: |
            *.vsix
            verdog-vscode-*-source.tar.gz
          if-no-files-found: error
