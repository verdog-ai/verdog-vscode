  <rect x="8.5" y="2.5" width="7" height="5" rx="1.5"/>
  <rect x="8.5" y="9.5" width="7" height="5" rx="1.5"/>
  <rect x="8.5" y="16.5" width="7" height="5" rx="2.5"/>
  <path d="M12 7.5v2M12 14.5v2"/>
</svg>
